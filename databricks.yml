# This is a Declarative Automation Bundle definition for dbs_bundle_260922.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dbs_bundle_260922
  uuid: 88de1c50-541b-4be0-9fa2-21ce99a6ff3f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-1345f388-285a.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-1345f388-285a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/e14d2b70-b6e1-4e4b-a378-0ce7776dd63b to make sure we only have a single copy.
      root_path: /Workspace/Users/e14d2b70-b6e1-4e4b-a378-0ce7776dd63b/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - service_principal_name: e14d2b70-b6e1-4e4b-a378-0ce7776dd63b
        level: CAN_MANAGE
